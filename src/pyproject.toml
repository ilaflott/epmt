[build-system]
requires = [
    "setuptools >= 61, <69",
    "wheel >= 0.29.0"
]
build-backend = "setuptools.build_meta"

[project]
name            = "epmt"
dynamic         = ["version"]
authors         = [ { name = "Minimal Metrics, LLC", email = "some.where@over.there" } ]
description     = "Experiment Performance Metrics Toolkit"
readme          = "README.md"
# 3.10/3.11 supported; 3.9 is EOL.
# 3.12 requires upgrading pandas (1.5→2.x) and SQLAlchemy (1.4→2.x)
# which dropped distutils; tracked in issue #105.
requires-python = ">=3.10,<3.12"
classifiers     = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
# Runtime dependencies: only packages directly imported by epmt at runtime.
# Transitive dependencies (e.g. Jinja2, Werkzeug, joblib) are resolved
# automatically by pip and should NOT be listed here.
dependencies = [
    "alembic",
    "Flask",
    "kneed",
    "numpy==1.26.4",
    "pandas==1.5.3",
    "plotly",
    "psycopg2-binary",
    "py-cpuinfo",
    "pyod",
    "python-daemon",
    "pytz",
    "scikit-learn",
    "scipy",
    "six",
    "SQLAlchemy==1.4.54",
]

[project.optional-dependencies]
notebook = [ # Interactive notebook / IPython shell support
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter",
    "jupyter-client",
    "jupyter-console",
    "jupyter-core",
	"jupyter-server<2",
    "notebook<7",
	"jupyterlab<4",
    "qtconsole",
]

ui = [ # Dash-based web UI
    "dash",
    "dash-bootstrap-components",
    "dash-daq",
    "dash-table",
]

docs = [ # Documentation generation
    "livereload",
    "mkdocs",
    "mkdocs-git-committers-plugin",
    "mkdocs-theme-bootstrap4",
]

devtest = [ # testing, linting and static analysis
    "pylint",
    "pytest",
]

build = [ # pyinstaller build reqs
    "pyinstaller==6.0.0",
    "pyinstaller-hooks-contrib==2023.11",
]

all = [ # Shorthand: install everything (mirrors the old flat dependency list)
    "epmt[notebook,ui,docs,devtest,build]",
]

[project.scripts]
epmt = "epmt.cli:main"

[project.urls]
"Homepage" = "https://github.com/noaa-gfdl/epmt"
"Bug Tracker" = "https://github.com/NOAA-GFDL/epmt/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "epmt.epmtlib.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
epmt = [
    "lib/*.so*",

    "alembic.ini",
    "preset_settings/*.py",

    "epmt_migrations/README",
    "epmt_migrations/env.py",
    "epmt_migrations/script.py.mako",
    "epmt_migrations/docker-entrypoint-initdb.d/init-user-db.sh",
    "epmt_migrations/versions/*",

    "test/run",
    "test/test_run.sh",
    "test/test_source.csh",

    "test/data/corrupted_csv/*",
    "test/data/csv/*",
    "test/data/daemon/627919.tgz",
    "test/data/daemon/ingest/*",
    "test/data/misc/*",
    "test/data/outliers/*",
    "test/data/outliers_nb/625151.tgz",
    "test/data/outliers_nb/627907.tgz",
    "test/data/outliers_nb/629322.tgz",
    "test/data/outliers_nb/633114.tgz",
    "test/data/outliers_nb/675992.tgz",
    "test/data/outliers_nb/680163.tgz",
    "test/data/outliers_nb/685001.tgz",
    "test/data/outliers_nb/691209.tgz",
    "test/data/outliers_nb/693129.tgz",
    "test/data/query/*",
    "test/data/submit/692500.tgz",
    "test/data/submit/804268.tgz",
    "test/data/submit/804280.tgz",
    "test/data/submit/3455/*",
    "test/data/tsv/collated-tsv-2220.tgz",
    "test/data/tsv/12340/*",

    "test/integration/conftest.py",
    "test/integration/test_integration_*.py",
    "test/integration/epmt-annotate.sh",
    "test/integration/epmt-escape-workload.sh",

    "test/shell/*",
]
